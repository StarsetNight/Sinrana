[workspace]
resolver = "2"
members = ["proto", "server", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sinrana contributors"]
repository = "https://github.com/StarsetNight/Sinrana"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
thiserror = "2.0.20"
serde_json = "1.0"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
rustls = "0.23"
rcgen = "0.14.9"
argon2 = "0.5"
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
axum = "0.8"
